# =====================================================
# Synapse RiskOps - Spring Boot Application Properties
# =====================================================

# ----- Server -----
server.port=8080
spring.application.name=synapse-riskops-backend

# ----- Database -----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/synapse_riskops}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:synapse_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:synapse_dev_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----- JWT -----
app.jwt.secret=${JWT_SECRET:dev_only_jwt_secret_key_do_not_use_in_production_change_this_immediately_64chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----- ML Engine -----
app.ml-engine.url=${ML_ENGINE_URL:http://localhost:8000}

# ----- Actuator (Health Checks) -----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ----- Logging -----
logging.level.com.synapse.riskops=DEBUG
logging.level.org.springframework.security=INFO

# ----- OpenAPI / Swagger -----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
