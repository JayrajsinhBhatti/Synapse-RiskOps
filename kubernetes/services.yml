# =============================================================================
# Synapse RiskOps - Kubernetes Services
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: genai-agent
  namespace: synapse
spec:
  selector:
    app: genai-agent
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: ml-engine
  namespace: synapse
spec:
  selector:
    app: ml-engine
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: synapse
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
