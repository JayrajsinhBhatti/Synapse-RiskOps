# =============================================================================
# Synapse RiskOps - Alertmanager Configuration
# =============================================================================
# Multi-receiver severity-based routing:
#   critical → n8n auto-remediation webhook + genai-agent
#   warning  → Slack notification only
#   info     → log only (null receiver)
# =============================================================================

global:
  resolve_timeout: 5m

route:
  receiver: 'default-slack'
  group_by: ['alertname', 'service', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    # Critical alerts → auto-remediation pipeline
    - match:
        severity: critical
      receiver: 'n8n-auto-remediation'
      group_wait: 5s
      continue: true

    # Critical alerts also go to GenAI agent for diagnosis
    - match:
        severity: critical
      receiver: 'genai-agent-webhook'
      continue: true

    # Warning alerts → Slack notification only
    - match:
        severity: warning
      receiver: 'default-slack'
      continue: false

    # Info alerts → log only
    - match:
        severity: info
      receiver: 'null-receiver'
      continue: false

receivers:
  # n8n webhook for auto-remediation pipeline
  - name: 'n8n-auto-remediation'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/prometheus-alert'
        send_resolved: true
        max_alerts: 10

  # GenAI Agent direct webhook for RCA diagnosis
  - name: 'genai-agent-webhook'
    webhook_configs:
      - url: 'http://genai-agent:8001/diagnose'
        send_resolved: false
        max_alerts: 5

  # Slack for warning-level notifications
  - name: 'default-slack'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/alert'
        send_resolved: true

  # Null receiver for info-level (log and discard)
  - name: 'null-receiver'

inhibit_rules:
  # Critical alerts suppress warning alerts for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Critical alerts suppress info alerts
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']

  # ServiceDown suppresses all other alerts for the same service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'High.*|Elevated.*|Request.*'
    equal: ['service']
