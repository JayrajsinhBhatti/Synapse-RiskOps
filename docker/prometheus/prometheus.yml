global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ----- Application Services -----
  - job_name: 'synapse-ml-engine'
    static_configs:
      - targets: ['ml-engine:8000']
    metrics_path: /metrics

  - job_name: 'synapse-genai-agent'
    static_configs:
      - targets: ['genai-agent:8001']
    metrics_path: /metrics

  - job_name: 'synapse-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /actuator/prometheus

  # ----- Infrastructure -----
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----- Container Metrics (cAdvisor) -----
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics

  # ----- Host Metrics (Node Exporter) -----
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ----- OpenTelemetry Collector Metrics -----
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # ----- Live Microservices (Synapse Live Cluster) -----
  - job_name: 'live-payment-service'
    static_configs:
      - targets: ['live-payments:9004']
    metrics_path: /metrics

  - job_name: 'live-api-gateway'
    static_configs:
      - targets: ['live-gateway:9001']
    metrics_path: /metrics

  - job_name: 'live-auth-service'
    static_configs:
      - targets: ['live-auth:9002']
    metrics_path: /metrics

  - job_name: 'live-order-service'
    static_configs:
      - targets: ['live-orders:9003']
    metrics_path: /metrics

  - job_name: 'live-inventory-service'
    static_configs:
      - targets: ['live-inventory:9005']
    metrics_path: /metrics

  - job_name: 'live-notification-svc'
    static_configs:
      - targets: ['live-notifications:9006']
    metrics_path: /metrics
